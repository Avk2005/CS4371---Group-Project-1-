# topic2 (entity counts from streaming_app.py) -> Elasticsearch index "hn-entities"
input {
  kafka {
    bootstrap_servers => "kafka:19092"
    topics => ["topic2"]
    group_id => "logstash-gp1"
    auto_offset_reset => "earliest"
    codec => json
  }
}
filter {
  date {
    match => ["batch_time", "ISO8601"]
    target => "@timestamp"
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "hn-entities"
  }
}
